version = 1

# Default: everything not otherwise marked is legendarymsr's own work.
# Per-file SPDX headers and the more specific annotations below win.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 legendarymsr"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
